services:
  db:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: imsor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: imsor
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imsor -d imsor"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: ./central-service
    container_name: ${COMPOSE_PROJECT_NAME}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000"
    environment:
      DATABASE_URL: postgresql://imsor:${DB_PASSWORD}@db:5432/imsor
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
