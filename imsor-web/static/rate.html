<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImSor — Rate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ── Top bar ─────────────────────────────────────────────────────── */
        #topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 50px;
            height: 46px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }
        #topbar-title { font-size: 1.05rem; font-weight: 600; color: #ddd; white-space: nowrap; }
        #site-nav { display: flex; gap: 14px; }
        #site-nav a { color: #aaa; text-decoration: none; font-size: 0.9rem; }
        #site-nav a:hover { color: #fff; }
        #status {
            position: absolute; right: 50px;
            color: #888; font-size: 0.85rem; white-space: nowrap; pointer-events: none;
        }
        button {
            padding: 7px 18px; font-size: 0.9rem;
            border: none; border-radius: 4px; cursor: pointer;
            background: #4a4a8a; color: #fff;
        }
        button:hover { background: #5a5aaa; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Loading / done ──────────────────────────────────────────────── */
        #loading-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #aaa;
        }

        /* ── Main layout ─────────────────────────────────────────────────── */
        #main-layout { flex: 1; overflow: hidden; display: none; flex-direction: column; }

        /* ── Image area ──────────────────────────────────────────────────── */
        #image-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #main-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 4px;
        }
        #filepath {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            font-size: 0.7rem; color: #444; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 80%;
            pointer-events: none;
        }

        /* ── Rating bar ──────────────────────────────────────────────────── */
        #rating-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-top: 1px solid #2a2a4a;
            background: #16162a;
        }
        .rating-btn {
            width: 52px; height: 44px;
            font-size: 1.1rem; font-weight: 600;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background: #252545;
            color: #888;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
            padding: 0;
        }
        .rating-btn:hover { background: #3a3a6a; color: #ddd; }
        .rating-btn.active {
            color: #fff;
            border-color: currentColor;
        }
        /* Colour gradient: 0–2 red, 3–5 amber, 6–8 teal, 9 green */
        .rating-btn[data-v="0"].active, .rating-btn[data-v="1"].active, .rating-btn[data-v="2"].active
            { background: #6b1f1f; color: #ff8888; }
        .rating-btn[data-v="3"].active, .rating-btn[data-v="4"].active, .rating-btn[data-v="5"].active
            { background: #5a4010; color: #ffcc55; }
        .rating-btn[data-v="6"].active, .rating-btn[data-v="7"].active, .rating-btn[data-v="8"].active
            { background: #0e4040; color: #55ddcc; }
        .rating-btn[data-v="9"].active
            { background: #1a5a1a; color: #88ff88; }

        #rating-label {
            font-size: 0.75rem; color: #555;
            margin-left: 12px; min-width: 80px;
        }
        #btn-clear {
            width: 52px; height: 44px;
            font-size: 1.1rem;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background: #252545;
            color: #555;
            margin-left: 12px;
            transition: background 0.1s, color 0.1s;
            padding: 0;
        }
        #btn-clear:hover { background: #3a1a1a; color: #e87070; }
        #btn-clear:disabled { opacity: 0.2; cursor: not-allowed; }

        #btn-skip {
            height: 44px; padding: 0 14px;
            font-size: 0.85rem;
            border: 2px solid transparent; border-radius: 6px;
            cursor: pointer; background: #252545; color: #666;
            margin-left: 20px;
            transition: background 0.1s, color 0.1s;
        }
        #btn-skip:hover { background: #3a3a1a; color: #cccc55; }

        #btn-veto {
            height: 44px; padding: 0 14px;
            font-size: 0.85rem;
            border: 2px solid transparent; border-radius: 6px;
            cursor: pointer; background: #252545; color: #666;
            margin-left: 8px;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
        }
        #btn-veto:hover { background: #3a1a1a; color: #e87070; }
        #btn-veto.active { background: #5a1a1a; color: #ff6060; border-color: #ff6060; }
    </style>
</head>
<body>

    <div id="topbar">
        <span id="topbar-title">ImSor — Rate</span>
        <button id="btn-prev" onclick="navigate(-1)">&#9664; Previous</button>
        <div id="site-nav">
            <a href="/">Home</a>
            <a href="/annotations">Annotations</a>
            <a href="/duplicates">Duplicates</a>
            <a href="/slideshow">Slideshow</a>
            <a href="/users" id="nav-users" style="display:none">Users</a>
            <a href="/admin" id="nav-admin" style="display:none">Admin</a>
        </div>
        <button id="btn-next" onclick="navigate(1)">Next &#9654;</button>
        <div id="status"></div>
    </div>

    <div id="loading-area"><div id="loading">Loading…</div></div>

    <div id="main-layout">
        <div id="image-area">
            <img id="main-img" alt="">
            <div id="filepath"></div>
        </div>
        <div id="rating-bar">
            <!-- buttons 0–9 injected by JS -->
            <span id="rating-label"></span>
            <button id="btn-clear" title="Remove rating (Delete)" disabled>✕</button>
            <button id="btn-skip" title="Skip — don't show again (S)">Skip</button>
            <button id="btn-veto" title="Veto — exclude from slideshow (V)">⊘ Veto</button>
        </div>
    </div>

    <script>
    // ── Nav ────────────────────────────────────────────────────────────────
    fetch('/api/current_user').then(r => r.json()).then(data => {
        if (data.logged_in && data.user?.role === 'superuser') {
            document.getElementById('nav-users').style.display = '';
            document.getElementById('nav-admin').style.display = '';
        }
    }).catch(() => {});

    // ── State ──────────────────────────────────────────────────────────────
    let queue = [];          // [{image_id, rating, annotation_id, veto_annotation_id}, …]
    let currentIndex = 0;
    const imageCache = new Map();   // image_id → Image object (URL)

    const LABELS = {
        null: '',
        0: 'Exclude',  1: 'Very unlikely',  2: 'Unlikely',
        3: 'Probably not',  4: 'Maybe',  5: 'Neutral',
        6: 'Possibly',  7: 'Likely',  8: 'Very likely',  9: 'Definitely include',
    };

    // ── Rating buttons ─────────────────────────────────────────────────────
    const bar = document.getElementById('rating-bar');
    for (let v = 0; v <= 9; v++) {
        const btn = document.createElement('button');
        btn.className = 'rating-btn';
        btn.dataset.v = v;
        btn.textContent = v;
        btn.title = LABELS[v];
        btn.addEventListener('click', () => applyRating(v));
        bar.insertBefore(btn, document.getElementById('rating-label'));
    }

    function renderRating(rating) {
        document.querySelectorAll('.rating-btn').forEach(btn => {
            btn.classList.toggle('active', rating !== null && parseInt(btn.dataset.v) === rating);
        });
        document.getElementById('rating-label').textContent = LABELS[rating] ?? '';
        document.getElementById('btn-clear').disabled = (rating === null);
    }

    function renderVeto(vetoed) {
        document.getElementById('btn-veto').classList.toggle('active', vetoed);
        document.getElementById('btn-veto').title = vetoed
            ? 'Vetoed — click or V to remove veto'
            : 'Veto — exclude from slideshow (V)';
    }

    // ── Data loading ───────────────────────────────────────────────────────
    async function loadData() {
        try {
            const resp = await fetch('/api/rating-queue');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            queue = await resp.json();
        } catch (err) {
            document.getElementById('loading').textContent = 'Error loading: ' + err.message;
            return;
        }

        document.getElementById('loading-area').style.display = 'none';

        if (queue.length === 0) {
            document.getElementById('loading-area').style.display = 'flex';
            document.getElementById('loading').textContent = 'No images to rate.';
            return;
        }

        document.getElementById('main-layout').style.display = 'flex';
        await showImage(0);
    }

    function updateStatus() {
        const ratedCount = queue.filter(q => q.rating !== null).length;
        document.getElementById('status').textContent =
            `Image ${currentIndex + 1} of ${queue.length} · ${ratedCount} rated`;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === queue.length - 1;
    }

    function prefetchNext() {
        if (currentIndex + 1 < queue.length) {
            const nextId = queue[currentIndex + 1].image_id;
            if (!imageCache.has(nextId)) {
                const preload = new Image();
                preload.src = `/serve/${nextId}`;
                imageCache.set(nextId, preload);
            }
        }
    }

    async function showImage(index) {
        currentIndex = index;
        const item = queue[index];
        document.getElementById('main-img').src = `/serve/${item.image_id}`;
        document.getElementById('filepath').textContent = '';
        renderRating(item.rating);
        renderVeto(item.veto_annotation_id !== null);
        updateStatus();
        prefetchNext();
    }

    // ── Rating CRUD ────────────────────────────────────────────────────────
    async function applyRating(value) {
        const item = queue[currentIndex];
        try {
            if (item.annotation_id) {
                // Update existing annotation
                const resp = await fetch(`/api/annotations/${item.annotation_id}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({value: String(value)}),
                });
                if (!resp.ok) throw new Error(await resp.text());
            } else {
                // Create new annotation
                const resp = await fetch('/api/annotations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        image_id: item.image_id,
                        annotation_type: 'slideshow_rating',
                        value: String(value),
                    }),
                });
                if (!resp.ok) throw new Error(await resp.text());
                const ann = await resp.json();
                item.annotation_id = ann.id;
            }
            item.rating = value;
            renderRating(value);
            updateStatus();
            // Auto-advance to next image
            if (currentIndex < queue.length - 1) {
                await showImage(currentIndex + 1);
            }
        } catch (err) {
            alert('Error saving rating: ' + err.message);
        }
    }

    // ── Clear rating ──────────────────────────────────────────────────────
    async function clearRating() {
        const item = queue[currentIndex];
        if (!item.annotation_id) return;   // nothing to delete
        try {
            const resp = await fetch(`/api/annotations/${item.annotation_id}`, {
                method: 'DELETE',
            });
            if (!resp.ok) throw new Error(await resp.text());
            item.rating = null;
            item.annotation_id = null;
            renderRating(null);
            updateStatus();
        } catch (err) {
            alert('Error removing rating: ' + err.message);
        }
    }

    document.getElementById('btn-clear').addEventListener('click', clearRating);

    // ── Veto ───────────────────────────────────────────────────────────────
    async function toggleVeto() {
        const item = queue[currentIndex];
        try {
            if (item.veto_annotation_id) {
                const resp = await fetch(`/api/annotations/${item.veto_annotation_id}`, { method: 'DELETE' });
                if (!resp.ok) throw new Error(await resp.text());
                item.veto_annotation_id = null;
            } else {
                const resp = await fetch('/api/annotations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image_id: item.image_id, annotation_type: 'veto', value: '1' }),
                });
                if (!resp.ok) throw new Error(await resp.text());
                const ann = await resp.json();
                item.veto_annotation_id = ann.id;
            }
            renderVeto(item.veto_annotation_id !== null);
        } catch (err) {
            alert('Error saving veto: ' + err.message);
        }
    }

    document.getElementById('btn-veto').addEventListener('click', toggleVeto);

    // ── Skip ───────────────────────────────────────────────────────────────
    async function skipImage() {
        const item = queue[currentIndex];
        try {
            const resp = await fetch('/api/annotations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image_id: item.image_id, annotation_type: 'skip', value: '1' }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            queue.splice(currentIndex, 1);
            if (queue.length === 0) {
                document.getElementById('main-layout').style.display = 'none';
                document.getElementById('loading-area').style.display = 'flex';
                document.getElementById('loading').textContent = 'No more images to rate.';
                return;
            }
            const next = Math.min(currentIndex, queue.length - 1);
            await showImage(next);
        } catch (err) {
            alert('Error saving skip: ' + err.message);
        }
    }

    document.getElementById('btn-skip').addEventListener('click', skipImage);

    // ── Navigation ─────────────────────────────────────────────────────────
    function navigate(delta) {
        const next = currentIndex + delta;
        if (next < 0 || next >= queue.length) return;
        showImage(next);
    }

    // ── Keyboard ───────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft')  { navigate(-1); return; }
        if (e.key === 'ArrowRight') { navigate(1);  return; }
        if (e.key === 'Delete' || e.key === 'Backspace') { clearRating(); return; }
        if (e.key === 'v' || e.key === 'V') { toggleVeto(); return; }
        if (e.key === 's' || e.key === 'S') { skipImage(); return; }
        if (e.key >= '0' && e.key <= '9') {
            applyRating(parseInt(e.key));
        }
    });

    // ── Boot ───────────────────────────────────────────────────────────────
    loadData();
    </script>
</body>
</html>
