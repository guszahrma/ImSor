<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImSor — Access Pending</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            max-width: 480px;
            padding: 3em 2em;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #aaa;
            margin-bottom: 2em;
        }
        a.btn {
            display: inline-block;
            padding: 10px 28px;
            background: #4a4a8a;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.95rem;
        }
        a.btn:hover { background: #5a5aaa; }
    </style>
</head>
<body>
    <div class="card">
        <p>The system owner has been informed of your interest, and they will get back to you when you have been assessed.</p>
        <a class="btn" href="/logout">Log out</a>
    </div>
</body>
</html>
