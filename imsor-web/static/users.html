<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div style="margin-bottom:1.5em;font-size:0.9em;">
      <a href="/" style="color:#555;text-decoration:none;margin-right:1.5em;">Home</a>
      <a href="/duplicates" style="color:#555;text-decoration:none;margin-right:1.5em;">Duplicates</a>
      <a href="/annotations" style="color:#555;text-decoration:none;margin-right:1.5em;">Annotations</a>
      <a href="/admin" style="color:#555;text-decoration:none;margin-right:1.5em;">Admin</a>
    </div>
    <h1>All Users</h1>
    <div id="not-authorized" class="hidden">
        <p><strong>Access denied:</strong> Only superusers can view this page.</p>
    </div>
    <div id="user-table-container" class="hidden">
        <table id="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Display Name</th>
                    <th>Role</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
    async function getCurrentUser() {
        const resp = await fetch('/api/current_user');
        if (!resp.ok) return null;
        return (await resp.json()).user;
    }
    async function getAllUsers() {
        const resp = await fetch('/api/users');
        if (!resp.ok) throw new Error('Failed to fetch users');
        return await resp.json();
    }
    (async function() {
        const user = await getCurrentUser();
        if (!user || user.role !== 'superuser') {
            document.getElementById('not-authorized').classList.remove('hidden');
            return;
        }
        document.getElementById('user-table-container').classList.remove('hidden');
        try {
            const users = await getAllUsers();
            const tbody = document.querySelector('#user-table tbody');
            users.forEach(u => {
                const tr = document.createElement('tr');
                const isSelf = u.id === user.id;
                const roleOptions = ['superuser', 'maintainer', 'basic-user'].map(r => `<option value="${r}"${u.role === r ? ' selected' : ''}>${r.replace('basic-user','basic-user')}</option>`).join('');
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.display_name || ''}</td>
                    <td>
                        <select data-user-id="${u.id}" class="role-select"${isSelf ? ' disabled' : ''}>${roleOptions}</select>
                    </td>
                    <td>${u.created_at ? new Date(u.created_at).toLocaleString() : ''}</td>
                `;
                tbody.appendChild(tr);
            });
            // Add event listeners for role changes
            document.querySelectorAll('.role-select').forEach(sel => {
                sel.addEventListener('change', async function() {
                    const userId = this.getAttribute('data-user-id');
                    const newRole = this.value;
                    this.disabled = true;
                    try {
                        const resp = await fetch(`/api/users/${userId}/role`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ role: newRole })
                        });
                        if (!resp.ok) throw new Error('Failed to update role');
                        this.style.background = '#c8e6c9'; // green highlight
                    } catch (e) {
                        alert('Failed to update role: ' + e.message);
                        this.style.background = '#ffcdd2'; // red highlight
                    } finally {
                        this.disabled = false;
                        setTimeout(() => { this.style.background = ''; }, 1200);
                    }
                });
            });
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5">Failed to load users.</td></tr>';
        }
    })();
    </script>
</body>
</html>
