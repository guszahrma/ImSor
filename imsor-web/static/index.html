<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImSor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 { margin-bottom: 40px; font-size: 1.8rem; }
        .nav-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 160px;
            background: #252545;
            border: 2px solid #333;
            border-radius: 8px;
            text-decoration: none;
            color: #e0e0e0;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-card:hover { background: #3a3a6a; border-color: #5a5aaa; }
        .nav-card .icon { font-size: 2.4rem; margin-bottom: 12px; }
        .nav-card .label { font-size: 1.1rem; font-weight: 600; }
        .nav-card .desc {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 6px;
            text-align: center;
            padding: 0 10px;
        }
        .nav-card.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>ImSor</h1>
    <div class="nav-grid">
        <a class="nav-card" href="/duplicates">
            <div class="icon">&#128247;</div>
            <div class="label">Duplicate Reviewer</div>
            <div class="desc">Compare and resolve duplicate images</div>
        </a>
        <a class="nav-card" href="/annotations">
            <div class="icon">&#128100;</div>
            <div class="label">Annotations</div>
            <div class="desc">View images with person detections</div>
        </a>
    </div>
</body>
</html>
