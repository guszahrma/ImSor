<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImSor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 { margin-bottom: 40px; font-size: 1.8rem; }
        .nav-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 160px;
            background: #252545;
            border: 2px solid #333;
            border-radius: 8px;
            text-decoration: none;
            color: #e0e0e0;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-card:hover { background: #3a3a6a; border-color: #5a5aaa; }
        .nav-card .icon { font-size: 2.4rem; margin-bottom: 12px; }
        .nav-card .label { font-size: 1.1rem; font-weight: 600; }
        .nav-card .desc {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 6px;
            text-align: center;
            padding: 0 10px;
        }
        .nav-card.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>ImSor</h1>
    <div class="nav-grid">
        <a class="nav-card" href="/duplicates">
            <div class="icon">&#128247;</div>
            <div class="label">Duplicate Reviewer</div>
            <div class="desc">Compare and resolve duplicate images</div>
        </a>
        <a class="nav-card" href="/annotations">
            <div class="icon">&#128100;</div>
            <div class="label">Annotations</div>
            <div class="desc">View images with person detections</div>
        </a>
        <a class="nav-card" id="users-nav-card" href="/users" style="display:none;">
            <div class="icon">&#128101;</div>
            <div class="label">Users</div>
            <div class="desc">View and manage all users (superuser only)</div>
        </a>
        <a class="nav-card" id="admin-nav-card" href="/admin" style="display:none;">
            <div class="icon">&#9881;&#65039;</div>
            <div class="label">Administration</div>
            <div class="desc">Cameras, communities, person links</div>
        </a>
    </div>
    <div id="auth-section" style="margin-top: 40px;"></div>
    <script>
    async function init() {
        const section = document.getElementById('auth-section');
        section.innerHTML = '<span style="color:#aaa">Checking login status...</span>';
        try {
            const resp = await fetch('/api/current_user');
            const data = await resp.json();
            if (data.logged_in) {
                const user = data.user;
                section.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;">
                        <img src="${user.picture}" alt="avatar" style="width:40px;height:40px;border-radius:50%;border:2px solid #4285F4;">
                        <span>Welcome, <b>${user.given_name || user.name}</b>!</span>
                        <a href="/logout" style="margin-left:20px;background:#e74c3c;color:white;padding:8px 18px;border-radius:4px;text-decoration:none;font-weight:600;">Logout</a>
                    </div>
                `;
                if (user.role === 'superuser') {
                    document.getElementById('users-nav-card').style.display = '';
                    document.getElementById('admin-nav-card').style.display = '';
                }
            } else {
                section.innerHTML = `
                    <a href="/login/google?prompt=select_account" style="
                        display: inline-block;
                        background: #4285F4;
                        color: white;
                        padding: 12px 28px;
                        border-radius: 4px;
                        font-size: 1rem;
                        text-decoration: none;
                        font-weight: 600;
                        box-shadow: 0 2px 8px rgba(66,133,244,0.15);
                        transition: background 0.2s;"
                        onmouseover="this.style.background='#3367D6'" onmouseout="this.style.background='#4285F4'">
                        <span style="vertical-align: middle; margin-right: 8px; font-size: 1.2em;">&#x1F464;</span>
                        Login with Google
                    </a>
                `;
            }
        } catch (e) {
            section.innerHTML = '<span style="color:#e74c3c">Failed to check login status.</span>';
        }
    }
    init();
</script>
</body>
</html>
